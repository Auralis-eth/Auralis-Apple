# Every first-party source root. `included:` overrides path arguments, so a root missing from this
# list is not lintable even by naming it explicitly on the command line — `swiftlint SomePackage`
# silently re-lints only what is listed here. Add new packages here when you create them.
included:
  - Auralis
  - AuralisTests
  - AuralisUITests
  - AuralisCrypto
  - AuraPlayEngines
  - AuralisContext
  - AuraUI
  - AuralisFoundation
  - AuralisTestSupport
  - AuralisMissionControl
  - AuralisOperators
  - AuralisPolicy
  - AuralisReceipts
  - AuralisRuntime
  - AuralisAppShell

# SwiftPM writes generated sources (notably `test_entry_point.swift`, whose SwiftPM-internal
# `__SwiftPM*` type names trip `type_name` at *error* severity) into each package's `.build`.
# Linting them fails the CI lint step over code nobody in this repository wrote or can change.
# One entry per package: `excluded:` matches path prefixes, not globs.
excluded:
  - AuralisCrypto/.build
  - AuraPlayEngines/.build
  - AuralisContext/.build
  - AuraUI/.build
  - AuralisFoundation/.build
  - AuralisTestSupport/.build
  - AuralisMissionControl/.build
  - AuralisOperators/.build
  - AuralisPolicy/.build
  - AuralisReceipts/.build
  - AuralisRuntime/.build
  - AuralisAppShell/.build

reporter: xcode

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - shorthand_operator
  - type_body_length

opt_in_rules:
  - empty_count
  - first_where
  - sorted_imports
  - toggle_bool

# This codebase deliberately favours long, fully-qualified type names
# (`AlwaysAvailableAuraPlayEmbeddingAvailabilityProvider`) over short ambiguous ones, which is why
# `identifier_name` is disabled above. 60 keeps the rule useful as a runaway-name guard without
# fighting that convention.
type_name:
  max_length: 60

# Provider response DTOs (`AlchemyNFTResponse`, `NFTInventoryItemSnapshot`) nest `Codable` payload
# shapes two deep to mirror the JSON they decode. Flattening them would scatter single-use types
# across module scope and lose that correspondence. The third level is not a style choice: Swift
# requires `CodingKeys` to be declared inside the type it serves, so a two-level DTO that needs
# custom key mapping is forced to three.
nesting:
  type_level: 3

custom_rules:
  auraplay_no_print:
    name: "AuraPlay No Print"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "\\bprint\\s*\\("
    message: "Use AuraPlayLogging instead of print() inside AuraPlay."
    severity: error

  auraplay_no_audioengine_shared:
    name: "AuraPlay No Global AudioEngine"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "AudioEngine\\.shared"
    message: "Inject playback dependencies instead of reaching for a global AudioEngine."
    severity: error

  auraplay_ticketed_todo:
    name: "AuraPlay Ticketed TODO"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "TODO(?!\\[[A-Z0-9-]+\\])"
    message: "AuraPlay TODOs must include a ticket reference like TODO[P1-012]."
    severity: warning

  icon_only_system_image_control_requires_accessibility_label:
    name: "Icon-only SystemImage controls require accessibility review"
    regex: '(?s)(Button|Menu|NavigationLink)\s*(?:\([^)]*\))?\s*\{[^{}]*(?:\{[^{}]*\}[^{}]*)?\}\s*label:\s*\{\s*SystemImage\(|Button\s*\([^)]*label:\s*\{\s*SystemImage\('
    message: "Icon-only controls using SystemImage must provide an accessible control label or be explicitly reviewed. Add .accessibilityLabel/.accessibilityInputLabels on the control, or document an intentional exception."
    severity: warning
