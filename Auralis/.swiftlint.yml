included:
  - Auralis
  - AuralisTests
  - AuralisUITests

reporter: xcode

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - shorthand_operator
  - type_body_length

opt_in_rules:
  - empty_count
  - first_where
  - sorted_imports
  - toggle_bool

custom_rules:
  auraplay_no_print:
    name: "AuraPlay No Print"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "\\bprint\\s*\\("
    message: "Use AuraPlayLogging instead of print() inside AuraPlay."
    severity: error

  auraplay_no_audioengine_shared:
    name: "AuraPlay No Global AudioEngine"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "AudioEngine\\.shared"
    message: "Inject playback dependencies instead of reaching for a global AudioEngine."
    severity: error

  auraplay_ticketed_todo:
    name: "AuraPlay Ticketed TODO"
    included: "Auralis/MusicApp/AuraPlay"
    regex: "TODO(?!\\[[A-Z0-9-]+\\])"
    message: "AuraPlay TODOs must include a ticket reference like TODO[P1-012]."
    severity: warning

  icon_only_system_image_control_requires_accessibility_label:
    name: "Icon-only SystemImage controls require accessibility review"
    regex: '(?s)(Button|Menu|NavigationLink)\s*(?:\([^)]*\))?\s*\{[^{}]*(?:\{[^{}]*\}[^{}]*)?\}\s*label:\s*\{\s*SystemImage\(|Button\s*\([^)]*label:\s*\{\s*SystemImage\('
    message: "Icon-only controls using SystemImage must provide an accessible control label or be explicitly reviewed. Add .accessibilityLabel/.accessibilityInputLabels on the control, or document an intentional exception."
    severity: warning
